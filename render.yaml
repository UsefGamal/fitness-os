services:
  - type: web
    name: fitness-os
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DIGEST_EMAIL_TO
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://fitness-os.onrender.com
