# The repository is public, so its dependencies get watched (SEC-17).
# Weekly, grouped, a few pull requests at most: versions stay pinned and
# every update goes through CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 3
    groups:
      capacitor: { patterns: ["@capacitor/*", "@capacitor-community/*"] }
      dev-tools: { dependency-type: development }
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 2
    # Gradle 9 needs Android Gradle Plugin 9, and Capacitor 8's plugins are
    # built against AGP 8. Take both majors together when Capacitor does.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      - dependency-name: com.android.tools.build:gradle
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 2
