name: Make signing key

# Run once, from the Actions tab on a phone (Run workflow). It makes the
# release keystore so nobody needs keytool on a computer (see
# mobile/README.md, Releases):
# 1. Before running, add the secrets FITNESS_OS_KEYSTORE_PASSWORD and
#    FITNESS_OS_ARTIFACT_PASSPHRASE (12+ characters each, different, both
#    saved in your password manager). The second one encrypts the artifact,
#    so someone who can read the repo can't use the key (P14-08, SEC-08).
# 2. Run this workflow. Its summary shows the certificate fingerprint for
#    the FITNESS_OS_CERT_SHA256 variable, and its artifact holds the
#    keystore (fitness-os.jks) and the text for FITNESS_OS_KEYSTORE_BASE64.
# 3. Keep fitness-os.jks in two safe places, add the secret and variable,
#    then delete the artifact (it also expires after a day).
# It refuses to run once FITNESS_OS_KEYSTORE_BASE64 exists, so a second
# run can't make a new key by mistake: a new key means no update installs
# over the app.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The signing secrets live in the release environment (P14-08), so this
    # job must run there too to see whether a key already exists.
    environment: release
    env:
      EXISTING: ${{ secrets.FITNESS_OS_KEYSTORE_BASE64 }}
      FITNESS_OS_KEYSTORE_PASSWORD: ${{ secrets.FITNESS_OS_KEYSTORE_PASSWORD }}
      ARTIFACT_PASSPHRASE: ${{ secrets.FITNESS_OS_ARTIFACT_PASSPHRASE }}
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Make the keystore
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error::FITNESS_OS_KEYSTORE_BASE64 is already set, so a key exists. Making a new one would stop updates installing over the app. Delete that secret first only if you really mean to start over."
            exit 1
          fi
          if [ "${#FITNESS_OS_KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::error::Add the secret FITNESS_OS_KEYSTORE_PASSWORD (at least 12 characters) first, then run this again."
            exit 1
          fi
          if [ "${#ARTIFACT_PASSPHRASE}" -lt 12 ] || [ "$ARTIFACT_PASSPHRASE" = "$FITNESS_OS_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the secret FITNESS_OS_ARTIFACT_PASSPHRASE (at least 12 characters, not the keystore password) first, then run this again."
            exit 1
          fi
          out="$RUNNER_TEMP/key"
          mkdir -p "$out"
          keytool -genkeypair -keystore "$out/fitness-os.jks" -storetype PKCS12 \
            -alias fitnessos -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env FITNESS_OS_KEYSTORE_PASSWORD \
            -dname "CN=Fitness OS" -noprompt
          base64 -w0 "$out/fitness-os.jks" > "$out/FITNESS_OS_KEYSTORE_BASE64.txt"
          sha=$(keytool -list -v -keystore "$out/fitness-os.jks" -alias fitnessos \
            -storepass:env FITNESS_OS_KEYSTORE_PASSWORD | sed -n 's/^.*SHA256: *//p' | head -1)
          # Only encrypted files leave the runner (P14-08, SEC-08).
          enc="$RUNNER_TEMP/enc"
          mkdir -p "$enc"
          tar -C "$out" -czf - fitness-os.jks FITNESS_OS_KEYSTORE_BASE64.txt \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ARTIFACT_PASSPHRASE \
              -out "$enc/signing-key.tar.gz.enc"
          rm -rf "$out"
          {
            echo "## Signing key made"
            echo
            echo "Add this as the repository **variable** \`FITNESS_OS_CERT_SHA256\`:"
            echo
            echo '```'
            echo "$sha"
            echo '```'
            echo
            echo "Then download the **signing-key** artifact below. It is encrypted with FITNESS_OS_ARTIFACT_PASSPHRASE. On a computer, open it with:"
            echo
            echo '```'
            echo 'openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing-key.tar.gz.enc | tar -xzf -'
            echo '```'
            echo
            echo "Keep \`fitness-os.jks\` in two safe places, paste the text of \`FITNESS_OS_KEYSTORE_BASE64.txt\` into the **secret** \`FITNESS_OS_KEYSTORE_BASE64\` of the **release** environment, and delete the artifact (Actions > this run > Artifacts > delete). Check that it says deleted."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-key
          path: ${{ runner.temp }}/enc/
          retention-days: 1
          if-no-files-found: error
