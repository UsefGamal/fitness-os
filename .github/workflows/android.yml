name: Android APK

# Two kinds of build (E1-S3):
# - every PR and push to main: a DEBUG APK (com.usefgamal.fitnessos.debug),
#   which installs beside the real app and never over it;
# - a tag like v0.4.1 (Releases > Draft a new release > new tag): the only
#   SIGNED RELEASE APK. Its versionCode comes from the tag, its signing
#   certificate is checked against the one on Yusuf's phone, and it is
#   attached to the GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", "content/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", "content/**", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      update_test_tag:
        description: "Only run the update-over-install test for this existing release tag (for example v0.9.5)"
        required: false
        default: ""

# P14-08: the default token can only read. Only the release job, which
# waits for Yusuf's approval in the release environment, may write.
permissions:
  contents: read

# A new push to a PR cancels that PR's older build. Pushes to main and tags
# each run in full (a release is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.update_test_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # scripts/export_content.py turns content/ into the app's content.json.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pillow shrinks the bundled exercise photos to WebP (about half the size).
      - name: Install Pillow
        run: pip install pillow==12.3.0

      # The photos only change when content/exercise_photos.py pins a new
      # dataset commit, so keep the converted set between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/exercise-db
          key: exercise-db-${{ hashFiles('content/exercise_photos.py', 'scripts/fetch_exercise_photos.py') }}

      # Meal photos come from Wikimedia Commons, which limits request
      # rates. Each run starts from the last run's set, fetches what is
      # missing for at most 5 minutes, and saves the set straight away (so
      # a later failure can't lose it). A photo still missing shows a
      # placeholder and comes in on a later run. The builds below don't
      # download again (MEAL_PHOTOS_SKIP).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/meal-photos
          key: meal-photos-${{ hashFiles('content/meal_photos.py') }}-${{ github.run_id }}
          # The second key keeps the photos already fetched when
          # content/meal_photos.py changes; the script refetches only new or
          # changed ones (titles.json). Without it every edit started from zero.
          restore-keys: |
            meal-photos-${{ hashFiles('content/meal_photos.py') }}-
            meal-photos-

      - name: Fetch meal photos
        timeout-minutes: 8
        continue-on-error: true
        env:
          MEAL_PHOTOS_BUDGET: "300"
        run: python scripts/fetch_meal_photos.py mobile/public/meal-photos

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/meal-photos
          key: meal-photos-${{ hashFiles('content/meal_photos.py') }}-${{ github.run_id }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── Debug: every PR and main push ─────────────────────────────────
      - name: Build debug APK
        env:
          MEAL_PHOTOS_SKIP: "1"
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 0.4.${{ github.run_number }}
        run: scripts/build-apk.sh debug

      - name: Check debug APK installs beside the real app
        run: scripts/check-apk.sh dist/fitness-os-debug.apk com.usefgamal.fitnessos.debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fitness-os-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Tags only. The release environment (Settings > Environments) needs
  # Yusuf's approval before this job starts, and holds the signing secrets,
  # so no other job or branch can reach the key (P14-08, SEC-05/06).
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write # to attach the APKs to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # scripts/export_content.py turns content/ into the app's content.json.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pillow shrinks the bundled exercise photos to WebP (about half the size).
      - name: Install Pillow
        run: pip install pillow==12.3.0

      # The photos only change when content/exercise_photos.py pins a new
      # dataset commit, so keep the converted set between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/exercise-db
          key: exercise-db-${{ hashFiles('content/exercise_photos.py', 'scripts/fetch_exercise_photos.py') }}

      # Meal photos come from Wikimedia Commons, which limits request
      # rates. Each run starts from the last run's set, fetches what is
      # missing for at most 5 minutes, and saves the set straight away (so
      # a later failure can't lose it). A photo still missing shows a
      # placeholder and comes in on a later run. The builds below don't
      # download again (MEAL_PHOTOS_SKIP).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/meal-photos
          key: meal-photos-${{ hashFiles('content/meal_photos.py') }}-${{ github.run_id }}
          # The second key keeps the photos already fetched when
          # content/meal_photos.py changes; the script refetches only new or
          # changed ones (titles.json). Without it every edit started from zero.
          restore-keys: |
            meal-photos-${{ hashFiles('content/meal_photos.py') }}-
            meal-photos-

      - name: Fetch meal photos
        timeout-minutes: 8
        continue-on-error: true
        env:
          MEAL_PHOTOS_BUDGET: "300"
        run: python scripts/fetch_meal_photos.py mobile/public/meal-photos

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/public/meal-photos
          key: meal-photos-${{ hashFiles('content/meal_photos.py') }}-${{ github.run_id }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── Release: tags only ────────────────────────────────────────────
      - name: Version from the tag
        run: scripts/version-from-tag.sh "${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Check What's new has this version
        run: scripts/check-whats-new.sh "$APK_VERSION_NAME"

      # PT-02 / SEC-05: the build (npm ci, tests, Vite, Gradle) runs with no
      # signing secret in its environment. Only the next step sees the key,
      # and it runs nothing but zipalign and apksigner.
      - name: Build unsigned release APKs
        env:
          MEAL_PHOTOS_SKIP: "1"
        run: scripts/build-apk.sh unsigned

      - name: Sign the release APKs
        env:
          KEYSTORE_B64: ${{ secrets.FITNESS_OS_KEYSTORE_BASE64 }}
          FITNESS_OS_KEYSTORE_PASSWORD: ${{ secrets.FITNESS_OS_KEYSTORE_PASSWORD }}
          FITNESS_OS_KEY_ALIAS: ${{ secrets.FITNESS_OS_KEY_ALIAS }}
          FITNESS_OS_KEY_PASSWORD: ${{ secrets.FITNESS_OS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$FITNESS_OS_KEYSTORE_PASSWORD" ]; then
            echo "::error::A release needs the FITNESS_OS_KEYSTORE_BASE64 and FITNESS_OS_KEYSTORE_PASSWORD secrets (see mobile/README.md, Releases)."
            exit 1
          fi
          scripts/sign-apk.sh dist/fitness-os-unsigned.apk dist/fitness-os-release.apk
          rm -f dist/fitness-os-unsigned*.apk

      - name: Check release ID, version and signing key
        env:
          CERT_SHA256: ${{ vars.FITNESS_OS_CERT_SHA256 }}
        run: |
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Set the repository variable FITNESS_OS_CERT_SHA256 to the certificate of the APK on the phone (see mobile/README.md, Releases), so a wrong key can't ship."
            exit 1
          fi
          scripts/check-apk.sh dist/fitness-os-release.apk com.usefgamal.fitnessos "$CERT_SHA256" "$APK_VERSION_CODE"
          # One app for everyone (Nov 2026): one APK per version.
          mv dist/fitness-os-release.apk "dist/fitness-os-${APK_VERSION_NAME}.apk"

      # P14-08: the notes list each APK's SHA-256, the certificate's and the
      # signing code About shows, so a friend can check what they installed.
      - name: Attach the APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ vars.FITNESS_OS_CERT_SHA256 }}
        run: |
          scripts/release-notes.sh "$APK_VERSION_NAME" "$CERT_SHA256" dist/*.apk > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fitness-os-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # P14-17: on each tag, after the release is attached, the previous
  # release is installed on an emulator and this one over it, the way a
  # friend updates. A refused update (wrong key, lower version) or a crash
  # on the first start after the update fails the tag.
  # It can also be run by hand for a release that already exists (Run
  # workflow > update_test_tag), which is how a fix to the test itself is
  # checked without cutting a version.
  update-test:
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.update_test_tag != '')) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the previous release, then this one over it
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: ${{ inputs.update_test_tag || github.ref_name }}
        run: scripts/update-over-install.sh "$UPDATE_TAG"
