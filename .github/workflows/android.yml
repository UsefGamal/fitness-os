name: Android APK

# Two kinds of build (E1-S3):
# - every PR and push to main: a DEBUG APK (com.usefgamal.fitnessos.debug),
#   which installs beside the real app and never over it;
# - a tag like v0.4.1 (Releases > Draft a new release > new tag): the only
#   SIGNED RELEASE APK. Its versionCode comes from the tag, its signing
#   certificate is checked against the one on Yusuf's phone, and it is
#   attached to the GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", "content/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", "content/**", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# P14-08: the default token can only read. Only the release job, which
# waits for Yusuf's approval in the release environment, may write.
permissions:
  contents: read

jobs:
  apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # scripts/export_content.py turns content/ into the app's content.json.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pillow shrinks the bundled exercise photos to WebP (about half the size).
      - name: Install Pillow
        run: pip install pillow==12.3.0

      # The photos only change when content/exercise_photos.py pins a new
      # dataset commit, so keep the converted set between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mobile/public/exercise-db
          key: exercise-db-${{ hashFiles('content/exercise_photos.py', 'scripts/fetch_exercise_photos.py') }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── Debug: every PR and main push ─────────────────────────────────
      - name: Build debug APK
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 0.4.${{ github.run_number }}
        run: scripts/build-apk.sh debug

      - name: Check debug APK installs beside the real app
        run: scripts/check-apk.sh dist/fitness-os-debug.apk com.usefgamal.fitnessos.debug

      # P14-02: the friends APK is built and checked on every PR too, so a
      # change that leaks Yusuf's plan into it fails here, not at release.
      - name: Build friends debug APK
        env:
          FITNESS_OS_FLAVOR: friends
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 0.4.${{ github.run_number }}
        run: scripts/build-apk.sh debug

      - name: Friends debug APK has no trace of Yusuf's plan
        run: python scripts/check_friends_build.py --apk dist/fitness-os-debug-friends.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitness-os-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Tags only. The release environment (Settings > Environments) needs
  # Yusuf's approval before this job starts, and holds the signing secrets,
  # so no other job or branch can reach the key (P14-08, SEC-05/06).
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write # to attach the APKs to the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # scripts/export_content.py turns content/ into the app's content.json.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pillow shrinks the bundled exercise photos to WebP (about half the size).
      - name: Install Pillow
        run: pip install pillow==12.3.0

      # The photos only change when content/exercise_photos.py pins a new
      # dataset commit, so keep the converted set between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mobile/public/exercise-db
          key: exercise-db-${{ hashFiles('content/exercise_photos.py', 'scripts/fetch_exercise_photos.py') }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── Release: tags only ────────────────────────────────────────────
      - name: Version from the tag
        run: scripts/version-from-tag.sh "${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.FITNESS_OS_KEYSTORE_BASE64 }}
          FITNESS_OS_KEYSTORE_PASSWORD: ${{ secrets.FITNESS_OS_KEYSTORE_PASSWORD }}
          FITNESS_OS_KEY_ALIAS: ${{ secrets.FITNESS_OS_KEY_ALIAS }}
          FITNESS_OS_KEY_PASSWORD: ${{ secrets.FITNESS_OS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$FITNESS_OS_KEYSTORE_PASSWORD" ]; then
            echo "::error::A release needs the FITNESS_OS_KEYSTORE_BASE64 and FITNESS_OS_KEYSTORE_PASSWORD secrets (see mobile/README.md, Releases)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # P14-02: one tag, one key, two APKs: Yusuf's and the friends one.
          FITNESS_OS_KEYSTORE="$RUNNER_TEMP/release.jks" FITNESS_OS_FLAVOR=yusuf scripts/build-apk.sh release
          FITNESS_OS_KEYSTORE="$RUNNER_TEMP/release.jks" FITNESS_OS_FLAVOR=friends scripts/build-apk.sh release
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check release ID, version and signing key
        env:
          CERT_SHA256: ${{ vars.FITNESS_OS_CERT_SHA256 }}
        run: |
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Set the repository variable FITNESS_OS_CERT_SHA256 to the certificate of the APK on the phone (see mobile/README.md, Releases), so a wrong key can't ship."
            exit 1
          fi
          scripts/check-apk.sh dist/fitness-os-release.apk com.usefgamal.fitnessos "$CERT_SHA256" "$APK_VERSION_CODE"
          scripts/check-apk.sh dist/fitness-os-release-friends.apk com.usefgamal.fitnessos "$CERT_SHA256" "$APK_VERSION_CODE"
          python scripts/check_friends_build.py --apk dist/fitness-os-release-friends.apk
          mv dist/fitness-os-release.apk "dist/fitness-os-${APK_VERSION_NAME}-yusuf.apk"
          mv dist/fitness-os-release-friends.apk "dist/fitness-os-${APK_VERSION_NAME}-friends.apk"

      # P14-08: the notes list each APK's SHA-256, the certificate's and the
      # signing code About shows, so a friend can check what they installed.
      - name: Attach the APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ vars.FITNESS_OS_CERT_SHA256 }}
        run: |
          scripts/release-notes.sh "$APK_VERSION_NAME" "$CERT_SHA256" dist/*.apk > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitness-os-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
