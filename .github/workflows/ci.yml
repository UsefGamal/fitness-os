name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# P14-08: the token can only read.
permissions:
  contents: read

jobs:
  # The phone app's logic: every lib test with the coverage gate, run in
  # UTC and in Cairo so date maths can't pass by luck of the runner's zone.
  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ["UTC", "Africa/Cairo"]
    name: js (${{ matrix.tz }})
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # export_content.py turns content/ into src/content.json for the tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci --no-audit --no-fund

      - name: Tests with coverage gate
        run: npm run coverage

      - name: No new hard-coded strings (i18n)
        run: npm run lint:i18n

  # Every screen at 360/390/412 px, left-to-right and right-to-left:
  # accessibility (axe, contrast), 44px taps, sideways scroll, page errors.
  # Counts may only go down (mobile/e2e/baseline.json), E6-S8.
  phone:
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Cairo
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Phone harness
        timeout-minutes: 15
        run: npm run e2e -- --shots

      # P14-17: the friends APK's screens have their own baseline.
      - name: Phone harness, friends build
        timeout-minutes: 15
        env:
          FITNESS_OS_FLAVOR: friends
        run: npm run e2e -- --shots

      # P14-17: setup states, 3 years of data at 6x slower CPU, midnight,
      # and the file mirror against a fake file system.
      - name: Device tests
        timeout-minutes: 10
        run: npm run e2e:device

      # P14-02: and the build the friends install (its own baseline).
      - name: Phone harness, friends build
        timeout-minutes: 15
        env:
          FITNESS_OS_FLAVOR: friends
        run: npm run e2e -- --shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-screens
          path: mobile/e2e/out/
          retention-days: 7

  # content/ and the export scripts.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest

      - name: Friends build has no trainer plan (E4-S2)
        run: python scripts/check_friends_build.py
