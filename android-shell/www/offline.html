<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness OS: can't connect</title>
<style>
  :root { --bg: #000; --surface: #1c1c1e; --text: #fff; --muted: #8e8e93; --accent: #30d158; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 17px -apple-system, system-ui, Roboto, sans-serif; }
  main { box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; gap: 16px;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--surface); border-radius: 16px; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; line-height: 1.4; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 50px;
    border-radius: 12px; background: var(--accent); color: #000; font-weight: 600;
    text-decoration: none; }
  a.btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Can't reach Fitness OS</h1>
    <p>Check your connection. If the server was asleep it can take up to a minute to wake up, so try again.</p>
  </div>
  <a class="btn" href="https://fitness-os.onrender.com/">Try again</a>
</main>
</body>
</html>
