[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "mobile"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: some content lines (long food names, notes, URLs) exceed 120 chars.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["content"]
