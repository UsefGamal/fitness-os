{% extends "base.html" %}
{% block title %}Recovery Session — Fitness OS{% endblock %}
{% block content %}
<h1><svg class="icon"><use href="#icon-heart"/></svg> Recovery — {{ workout.log_date }}</h1>
<p class="muted">{{ workout.notes or "" }}</p>

<section class="card card-glow">
  <h2><svg class="icon"><use href="#icon-check"/></svg> Checklist</h2>
  {% for item in checklist %}
  <div class="quest-card{% if item.done %} quest-done{% endif %}">
    <svg class="icon quest-icon"><use href="#icon-heart"/></svg>
    <div class="quest-body"><span class="quest-label">{{ item.name }}</span></div>
    <form method="post" action="/recovery/{{ workout.id }}/log" class="js-toggle">
      <input type="hidden" name="item_name" value="{{ item.name }}">
      <button type="submit" class="meal-check-btn{% if item.done %} done{% endif %}" data-done-label="✓ Done" data-undone-label="Mark done">{% if item.done %}✓ Done{% else %}Mark done{% endif %}</button>
    </form>
  </div>
  {% endfor %}
</section>

<a class="back-link" href="/recovery"><svg class="icon"><use href="#icon-chevron-left"/></svg> Back to recovery sessions</a>
{% endblock %}
