{% extends "base.html" %}
{% block title %}Settings — Fitness OS{% endblock %}
{% block content %}
<h1><svg class="icon"><use href="#icon-gear"/></svg> Settings</h1>

{% if saved %}<p style="color:var(--accent);font-size:14px;display:flex;align-items:center;gap:6px"><svg class="icon icon-fill"><use href="#icon-check"/></svg> Saved.</p>{% endif %}

<section class="card">
  <h2><svg class="icon"><use href="#icon-user"/></svg> Profile & Goal</h2>
  <form method="post" action="/settings" class="stack-form">
    <label>Height (cm) <input type="number" step="0.1" name="height_cm" value="{{ profile.height_cm }}" required></label>
    <label>Date of birth <input type="date" name="date_of_birth" value="{{ profile.date_of_birth }}" required></label>
    <label>Starting weight (kg) — drives your confidence score and predicted goal date
      <input type="number" step="0.1" name="start_weight_kg" value="{{ profile.start_weight_kg or '' }}" required>
    </label>
    <label>Goal weight — low (kg) <input type="number" step="0.1" name="goal_weight_low_kg" value="{{ profile.goal_weight_low_kg }}" required></label>
    <label>Goal weight — high (kg) <input type="number" step="0.1" name="goal_weight_high_kg" value="{{ profile.goal_weight_high_kg }}" required></label>
    <label>Goal date <input type="date" name="goal_date" value="{{ profile.goal_date }}" required></label>
    <label>Fitness level
      <select name="fitness_level">
        {% for level in fitness_levels %}
        <option value="{{ level }}" {% if level == profile.fitness_level %}selected{% endif %}>{{ level | capitalize }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Activity notes (optional) <input type="text" name="activity_notes" value="{{ profile.activity_notes }}"></label>
    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
