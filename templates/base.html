<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Fitness OS{% endblock %}</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#090c14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include "_icons.html" %}
{% if logged_in %}
<header class="topbar">
  <a class="brand" href="/"><svg class="icon brand-mark"><use href="#icon-bolt"/></svg> Fitness OS</a>
</header>
{% endif %}
<main class="content{% if logged_in %} has-tabbar{% endif %}">
{% block content %}{% endblock %}
</main>
{% if logged_in %}
<nav class="tabbar">
  <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><svg class="icon tab-icon"><use href="#icon-home"/></svg><span>Home</span></a>
  <a href="/meals" class="{% if request.url.path.startswith('/meals') %}active{% endif %}"><svg class="icon tab-icon"><use href="#icon-utensils"/></svg><span>Meals</span></a>
  <a href="/bonus" class="{% if request.url.path.startswith('/bonus') %}active{% endif %}"><svg class="icon tab-icon"><use href="#icon-star"/></svg><span>Quests</span></a>
  <a href="/body" class="{% if request.url.path.startswith('/body') %}active{% endif %}"><svg class="icon tab-icon"><use href="#icon-scale"/></svg><span>Body</span></a>
  <a href="/more" class="{% if request.url.path.startswith('/more') %}active{% endif %}"><svg class="icon tab-icon"><use href="#icon-dots"/></svg><span>More</span></a>
</nav>
{% endif %}
<script src="/static/app.js"></script>
</body>
</html>
